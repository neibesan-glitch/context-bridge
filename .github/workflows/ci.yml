name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-scripts:
    name: Analyse statique des scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          shellcheck --severity=warning install.sh
          shellcheck --shell=sh --severity=warning .claude/hooks/context-bridge-start.sh
          shellcheck --shell=sh --severity=warning .claude/hooks/context-bridge-stop.sh

      - name: Analyse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("install.ps1", ".claude/hooks/context-bridge-start.ps1", ".claude/hooks/context-bridge-stop.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "$f : $($_.Message)" }
              throw "Erreurs de syntaxe dans $f"
            }
            Write-Host "$f : syntaxe valide"
          }

      - name: JSON valide
        run: python3 -c "import json;json.load(open('.claude/settings.json'));print('settings.json valide')"

  invariants:
    name: Invariants du protocole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Le protocole n'existe qu'une fois
        run: |
          # Seul AGENTS.md porte le protocole. Les pointeurs ne le recopient pas.
          MARKER="Fin de session"
          FAIL=0
          for f in CLAUDE.md .cursorrules .windsurfrules \
                   .cursor/rules/context-bridge.mdc \
                   .windsurf/rules/context-bridge.md \
                   .github/copilot-instructions.md; do
            if grep -q "$MARKER" "$f" && grep -q "Ecriture obligatoire\|écriture obligatoire" "$f"; then
              echo "::error file=$f::Ce pointeur recopie le protocole. Il doit renvoyer a AGENTS.md."
              FAIL=1
            fi
            if ! grep -q "AGENTS.md" "$f"; then
              echo "::error file=$f::Ce fichier ne renvoie pas a AGENTS.md."
              FAIL=1
            fi
          done
          grep -q "$MARKER" AGENTS.md || { echo "::error::AGENTS.md ne contient pas le protocole."; FAIL=1; }
          exit $FAIL

      - name: Versions synchronisees
        run: |
          A=$(grep -o 'context-bridge:version [0-9.]*' AGENTS.md | awk '{print $2}')
          B=$(grep -m1 '^VERSION=' install.sh | cut -d'"' -f2)
          C=$(grep -m1 'CBVersion = ' install.ps1 | cut -d'"' -f2)
          echo "AGENTS.md=$A install.sh=$B install.ps1=$C"
          test "$A" = "$B" && test "$B" = "$C" || { echo "::error::Versions desynchronisees."; exit 1; }

      - name: Les gabarits ne contiennent pas la memoire du depot
        run: |
          if grep -rq "Context Bridge 1\.\|Audit et passage" template/docs/; then
            echo "::error::template/docs/ contient du contenu propre au depot."
            exit 1
          fi
          echo "template/docs/ est vierge"

      - name: Liens wiki valides
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          fail = False
          for root in ("docs", "template/docs"):
              base = pathlib.Path(root)
              names = {p.stem for p in base.rglob("*.md")}
              for md in base.rglob("*.md"):
                  text = md.read_text(encoding="utf-8")
                  # On ignore les blocs de code, qui contiennent des exemples.
                  text = re.sub(r"```.*?```", "", text, flags=re.S)
                  for link in re.findall(r"\[\[([^\]|]+)", text):
                      target = link.strip()
                      if target not in names:
                          print(f"::error file={md}::lien wiki mort : [[{target}]]")
                          fail = True
          print("liens wiki verifies")
          sys.exit(1 if fail else 0)
          PY

  install-bash:
    name: Installation Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installation dans un projet neuf
        run: |
          set -euo pipefail
          export CONTEXT_BRIDGE_BASE="file://$GITHUB_WORKSPACE"
          mkdir -p /tmp/projet && cd /tmp/projet
          git init -q && git config user.email ci@example.com && git config user.name CI
          echo "print('hello')" > app.py
          bash "$GITHUB_WORKSPACE/install.sh"
          for f in AGENTS.md CLAUDE.md .cursorrules .windsurfrules \
                   .cursor/rules/context-bridge.mdc \
                   .windsurf/rules/context-bridge.md \
                   .github/copilot-instructions.md \
                   .claude/settings.json \
                   .claude/hooks/context-bridge-start.sh \
                   .claude/hooks/context-bridge-stop.sh \
                   .claude/commands/handoff.md \
                   docs/INDEX.md docs/CODE_MAP.md docs/state.md docs/roadmap.md \
                   docs/permanent/choix_techniques.md docs/permanent/regles_projet.md \
                   docs/journal/journal_bord.md docs/journal/journal_erreurs.md; do
            test -f "$f" || { echo "::error::fichier manquant apres installation : $f"; exit 1; }
          done
          grep -q "^@AGENTS.md" CLAUDE.md
          grep -q "\.claude/\.cache/" .gitignore
          test ! -d template
          echo "installation OK"

      - name: Reinstallation refusee, mise a jour acceptee
        run: |
          set -euo pipefail
          export CONTEXT_BRIDGE_BASE="file://$GITHUB_WORKSPACE"
          cd /tmp/projet
          echo "ma memoire" >> docs/state.md
          if bash "$GITHUB_WORKSPACE/install.sh"; then
            echo "::error::la reinstallation aurait du etre refusee"; exit 1
          fi
          bash "$GITHUB_WORKSPACE/install.sh" --update
          grep -q "ma memoire" docs/state.md || { echo "::error::--update a ecrase docs/"; exit 1; }
          echo "update OK"

      - name: Le hook bloque une session sans passation
        run: |
          set -uo pipefail
          cd /tmp/projet
          export CLAUDE_PROJECT_DIR=/tmp/projet

          # Un depot sans commit a tous ses fichiers non suivis, docs/state.md
          # compris : le hook considere alors la passation comme deja ecrite.
          # On part donc d'un arbre propre.
          git add -A && git commit -qm "installation"
          rm -rf .claude/.cache
          echo "print('modif')" >> app.py

          JSON='{"session_id":"test-1","hook_event_name":"Stop","stop_hook_active":false}'

          set +e
          echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh 2>/tmp/err.txt
          CODE=$?
          set -e
          test "$CODE" -eq 2 || { echo "::error::le hook aurait du bloquer (code $CODE)"; exit 1; }
          grep -q "passation manquante" /tmp/err.txt
          echo "blocage OK"

          # Deuxieme appel dans la meme session : ne bloque plus.
          set +e
          echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh >/dev/null 2>&1
          CODE=$?
          set -e
          test "$CODE" -eq 0 || { echo "::error::le hook a bloque deux fois (code $CODE)"; exit 1; }
          echo "un seul blocage par session OK"

      - name: Le hook laisse passer une session documentee
        run: |
          set -uo pipefail
          cd /tmp/projet
          export CLAUDE_PROJECT_DIR=/tmp/projet
          rm -rf .claude/.cache
          printf '### Session du 2026-01-01\n- Realise : correctif\n- Prochaines etapes : rien\n' \
            >> docs/journal/journal_bord.md
          JSON='{"session_id":"test-2","hook_event_name":"Stop","stop_hook_active":false}'
          set +e
          echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh >/dev/null 2>&1
          CODE=$?
          set -e
          test "$CODE" -eq 0 || { echo "::error::le hook a bloque une session documentee (code $CODE)"; exit 1; }
          echo "passage OK"

      - name: Une passation sans contenu ne suffit pas
        run: |
          set -uo pipefail
          cd /tmp/projet
          export CLAUDE_PROJECT_DIR=/tmp/projet
          git add -A && git commit -qm "reset substance"
          rm -rf .claude/.cache
          echo "print('travail')" >> app.py
          # Uniquement des lignes blanches : le fichier est touche mais rien n'est ecrit.
          printf '\n   \n\n' >> docs/state.md
          JSON='{"session_id":"blanc","hook_event_name":"Stop","stop_hook_active":false}'
          set +e
          echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh 2>/tmp/blanc.txt
          CODE=$?
          set -e
          test "$CODE" -eq 2 || { echo "::error::une passation blanche a ete acceptee (code $CODE)"; exit 1; }
          grep -q "minimum attendu" /tmp/blanc.txt
          echo "controle de substance OK"

      - name: Le repere de session est pose sans ecrire sur stdout
        run: |
          set -uo pipefail
          cd /tmp/projet
          export CLAUDE_PROJECT_DIR=/tmp/projet
          git add -A && git commit -qm "reset repere"
          rm -rf .claude/.cache
          JSONS='{"session_id":"rep","hook_event_name":"SessionStart","source":"startup"}'
          OUT=$(echo "$JSONS" | sh .claude/hooks/context-bridge-start.sh)
          # Claude Code injecte le stdout d'un hook SessionStart dans le contexte :
          # le silence garantit un cout de zero token.
          test -z "$OUT" || { echo "::error::le hook SessionStart ecrit sur stdout : '$OUT'"; exit 1; }
          test -f .claude/.cache/session-rep || { echo "::error::repere absent"; exit 1; }
          grep -q '^state=' .claude/.cache/session-rep
          grep -q '^bord='  .claude/.cache/session-rep
          grep -q '^head=.\+' .claude/.cache/session-rep
          echo "repere OK"

      - name: Une passation deja commitee reste comptee
        run: |
          set -uo pipefail
          cd /tmp/projet
          export CLAUDE_PROJECT_DIR=/tmp/projet
          git add -A && git commit -qm "reset commit"
          rm -rf .claude/.cache
          JSONS='{"session_id":"cmt","hook_event_name":"SessionStart","source":"startup"}'
          echo "$JSONS" | sh .claude/hooks/context-bridge-start.sh
          echo "print('travail')" >> app.py
          printf '### Session du 2026-01-02\n- Realise : travail\n- Prochaines etapes : rien\n' \
            >> docs/journal/journal_bord.md
          git add -A && git commit -qm "travail + passation"
          # Nouvelle modification apres le commit : la passation de la session
          # reste comptee grace au commit memorise dans le repere.
          echo "print('encore')" >> app.py
          JSON='{"session_id":"cmt","hook_event_name":"Stop","stop_hook_active":false}'
          set +e
          echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh >/dev/null 2>&1
          CODE=$?
          set -e
          test "$CODE" -eq 0 || { echo "::error::une passation commitee a ete ignoree (code $CODE)"; exit 1; }
          echo "passation commitee OK"

      - name: Hors depot Git, le hook fonctionne via le repere de session
        run: |
          set -uo pipefail
          rm -rf /tmp/sansgit && mkdir -p /tmp/sansgit
          cd /tmp/sansgit
          cp -r /tmp/projet/docs /tmp/projet/.claude .
          rm -rf .claude/.cache
          printf 'etat\n' > docs/state.md
          printf 'journal\n' > docs/journal/journal_bord.md
          echo "print('code')" > app.py
          export CLAUDE_PROJECT_DIR=/tmp/sansgit
          JSON='{"session_id":"ng","hook_event_name":"Stop","stop_hook_active":false}'
          JSONS='{"session_id":"ng","hook_event_name":"SessionStart","source":"startup"}'

          # 1. Sans repere, aucune comparaison possible : le hook se tait.
          set +e; echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh >/dev/null 2>&1; CODE=$?; set -e
          test "$CODE" -eq 0 || { echo "::error::le hook devrait se taire sans repere (code $CODE)"; exit 1; }

          # 2. Repere pose, travail produit, aucune passation : blocage.
          echo "$JSONS" | sh .claude/hooks/context-bridge-start.sh
          sleep 1
          echo "print('modif')" >> app.py
          set +e; echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh 2>/tmp/ng.txt; CODE=$?; set -e
          test "$CODE" -eq 2 || { echo "::error::le hook aurait du bloquer hors Git (code $CODE)"; exit 1; }
          grep -q "passation manquante" /tmp/ng.txt

          # 3. Passation reelle ecrite : passage.
          rm -f .claude/.cache/handoff-ng
          printf '### Session du 2026-01-03\n- Realise : travail\n- Prochaines etapes : rien\n' \
            >> docs/journal/journal_bord.md
          set +e; echo "$JSON" | sh .claude/hooks/context-bridge-stop.sh >/dev/null 2>&1; CODE=$?; set -e
          test "$CODE" -eq 0 || { echo "::error::passation reelle refusee hors Git (code $CODE)"; exit 1; }
          echo "mode hors Git OK"

      - name: Le hook ignore un projet sans Context Bridge
        run: |
          set -uo pipefail
          mkdir -p /tmp/autre && cd /tmp/autre
          git init -q
          export CLAUDE_PROJECT_DIR=/tmp/autre
          set +e
          echo '{"session_id":"x","stop_hook_active":false}' | sh "$GITHUB_WORKSPACE/.claude/hooks/context-bridge-stop.sh" >/dev/null 2>&1
          CODE=$?
          set -e
          test "$CODE" -eq 0 || { echo "::error::le hook interfere hors projet Context Bridge (code $CODE)"; exit 1; }
          echo "non-interference OK"

  install-powershell:
    name: Installation PowerShell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Installation puis mise a jour
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CONTEXT_BRIDGE_BASE = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Path /tmp/projet-ps -Force | Out-Null
          Set-Location /tmp/projet-ps
          git init -q
          "print('hello')" | Out-File app.py

          & "$env:GITHUB_WORKSPACE/install.ps1"

          $expected = @(
            "AGENTS.md", "CLAUDE.md", ".cursorrules", ".windsurfrules",
            ".cursor/rules/context-bridge.mdc",
            ".windsurf/rules/context-bridge.md",
            ".github/copilot-instructions.md",
            ".claude/settings.json",
            ".claude/hooks/context-bridge-start.ps1",
            ".claude/hooks/context-bridge-stop.ps1",
            ".claude/commands/handoff.md",
            "docs/INDEX.md", "docs/CODE_MAP.md", "docs/state.md", "docs/roadmap.md",
            "docs/permanent/choix_techniques.md", "docs/permanent/regles_projet.md",
            "docs/journal/journal_bord.md", "docs/journal/journal_erreurs.md"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { throw "fichier manquant apres installation : $f" }
          }
          if (-not (Select-String -Path ".claude/settings.json" -Pattern "context-bridge-stop.ps1" -Quiet)) {
            throw "settings.json ne pointe pas vers le hook PowerShell"
          }

          # Reinstallation : doit rendre la main sans planter et sans rien ecraser.
          Add-Content docs/state.md "ma memoire"
          & "$env:GITHUB_WORKSPACE/install.ps1"
          if (-not (Select-String -Path "docs/state.md" -Pattern "ma memoire" -Quiet)) {
            throw "la reinstallation a ecrase docs/"
          }

          & "$env:GITHUB_WORKSPACE/install.ps1" -Update
          if (-not (Select-String -Path "docs/state.md" -Pattern "ma memoire" -Quiet)) {
            throw "-Update a ecrase docs/"
          }
          Write-Host "installation et mise a jour PowerShell OK"

      - name: Le hook PowerShell bloque une session sans passation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location /tmp/projet-ps
          $env:CLAUDE_PROJECT_DIR = "/tmp/projet-ps"

          # Arbre propre requis : sans commit, docs/state.md est non suivi et le
          # hook considere la passation comme deja ecrite.
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -qm "installation"
          Remove-Item -Recurse -Force .claude/.cache -ErrorAction SilentlyContinue
          Add-Content app.py "print('modif')"

          $json = '{"session_id":"test-ps","hook_event_name":"Stop","stop_hook_active":false}'
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>/tmp/err-ps.txt
          if ($LASTEXITCODE -ne 2) { throw "le hook aurait du bloquer (code $LASTEXITCODE)" }
          if (-not (Select-String -Path /tmp/err-ps.txt -Pattern "passation manquante" -Quiet)) {
            throw "message de blocage absent"
          }

          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>$null
          if ($LASTEXITCODE -ne 0) { throw "le hook a bloque deux fois (code $LASTEXITCODE)" }
          Write-Host "hook PowerShell OK"

      - name: Le hook PowerShell exige du contenu, pas un fichier touche
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Set-Location /tmp/projet-ps
          $env:CLAUDE_PROJECT_DIR = "/tmp/projet-ps"
          git add -A; git commit -qm "reset substance ps"
          Remove-Item -Recurse -Force .claude/.cache -ErrorAction SilentlyContinue

          Add-Content app.py "print('travail')"
          # Uniquement des lignes blanches : le fichier est touche mais rien n'est ecrit.
          Add-Content docs/state.md "`n   `n"

          $json = '{"session_id":"blanc-ps","hook_event_name":"Stop","stop_hook_active":false}'
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>/tmp/blanc-ps.txt
          if ($LASTEXITCODE -ne 2) { throw "une passation blanche a ete acceptee (code $LASTEXITCODE)" }
          if (-not (Select-String -Path /tmp/blanc-ps.txt -Pattern "minimum attendu" -Quiet)) {
            throw "le message ne mentionne pas le minimum attendu"
          }

          # Passation reelle : passage.
          Remove-Item .claude/.cache/handoff-blanc-ps -Force
          Add-Content docs/journal/journal_bord.md "### Session du 2026-01-01`n- Realise : correctif`n- Prochaines etapes : rien"
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>$null
          if ($LASTEXITCODE -ne 0) { throw "une passation reelle a ete refusee (code $LASTEXITCODE)" }
          Write-Host "controle de substance PowerShell OK"

      - name: Hors depot Git, le hook PowerShell utilise le repere de session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Remove-Item -Recurse -Force /tmp/sansgit-ps -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path /tmp/sansgit-ps -Force | Out-Null
          Set-Location /tmp/sansgit-ps
          Copy-Item -Recurse /tmp/projet-ps/docs .
          Copy-Item -Recurse /tmp/projet-ps/.claude .
          Remove-Item -Recurse -Force .claude/.cache -ErrorAction SilentlyContinue
          "etat" | Set-Content docs/state.md
          "journal" | Set-Content docs/journal/journal_bord.md
          "print('code')" | Set-Content app.py
          $env:CLAUDE_PROJECT_DIR = "/tmp/sansgit-ps"

          $json  = '{"session_id":"ng-ps","hook_event_name":"Stop","stop_hook_active":false}'
          $jsonS = '{"session_id":"ng-ps","hook_event_name":"SessionStart","source":"startup"}'

          # 1. Sans repere, le hook se tait.
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>$null
          if ($LASTEXITCODE -ne 0) { throw "le hook devrait se taire sans repere (code $LASTEXITCODE)" }

          # 2. Repere pose (silencieux), travail produit, aucune passation : blocage.
          $sortie = ($jsonS | pwsh -NoProfile -File .claude/hooks/context-bridge-start.ps1)
          if (-not [string]::IsNullOrWhiteSpace($sortie)) {
            throw "le hook SessionStart ecrit sur stdout : '$sortie'"
          }
          if (-not (Test-Path .claude/.cache/session-ng-ps)) { throw "repere absent" }
          Start-Sleep -Seconds 1
          Add-Content app.py "print('modif')"
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>/tmp/ng-ps.txt
          if ($LASTEXITCODE -ne 2) { throw "le hook aurait du bloquer hors Git (code $LASTEXITCODE)" }

          # 3. Passation reelle : passage.
          Remove-Item .claude/.cache/handoff-ng-ps -Force
          Add-Content docs/journal/journal_bord.md "### Session du 2026-01-03`n- Realise : travail`n- Prochaines etapes : rien"
          $json | pwsh -NoProfile -File .claude/hooks/context-bridge-stop.ps1 2>$null
          if ($LASTEXITCODE -ne 0) { throw "passation reelle refusee hors Git (code $LASTEXITCODE)" }
          Write-Host "mode hors Git PowerShell OK"
